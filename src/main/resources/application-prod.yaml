spring:
  application:
    name: attendance-io-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 30d
    cookie:
      name: JSESSIONID
      http-only: true # Prevent XSS attacks
      secure: true # Set to true in production with HTTPS
      same-site: none # Required for Capacitor (cross-site WebView -> API)
      max-age: 30d
  # Timezone configuration - Set JVM timezone to IST (Asia/Kolkata) for scheduled tasks
  jackson:
    time-zone: Asia/Kolkata

# Application configuration
app:
  frontend:
    url: ${FRONTEND_URL:https://attendanceio.paramsavjani.in}
  auth-debug: ${AUTH_DEBUG:false}
  classes:
    start-date: ${CLASSES_START_DATE:2026-01-05} # Format: yyyy-MM-dd (e.g., 2025-01-01)
    end-date: ${CLASSES_END_DATE:2026-04-30} # Format: yyyy-MM-dd (e.g., 2026-04-30) - Semester/lecture end date
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-32-characters-long-for-hs256-algorithm-param-savjani} # Must be at least 256 bits (32 characters) for HS256 algorithm. Store securely in Z-Ability.
    expiration-months: ${JWT_EXPIRATION_MONTHS:2} # Token expiration in months (1 or 2)
  update:
    latest-build: ${APP_LATEST_BUILD:267} # Latest app build number (e.g., 132 from GitHub releases)
    critical-build: ${APP_CRITICAL_BUILD:267} # Minimum supported build number (builds below this require critical update)
    title: ${APP_UPDATE_TITLE:Update Available} # Title for non-critical updates
    message: ${APP_UPDATE_MESSAGE:A new version is available with bug fixes and improvements.}
    critical-title: ${APP_CRITICAL_TITLE:Update Required} # Title for critical updates
    critical-message: ${APP_CRITICAL_MESSAGE:A new version is available with bug fixes and improvements.} # Message for critical updates

# Server configuration
server:
  port: 8080
  # If you run behind Nginx/Cloudflare/Render/etc, this ensures Spring sees https scheme
  # (prevents Google redirect_uri_mismatch due to http vs https).
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        same-site: none
        secure: true
  error:
    include-message: always
    include-binding-errors: always

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    # Explicitly set all packages to INFO to prevent DEBUG logs
    com.attendanceio: INFO
    org.springframework: INFO
    org.hibernate: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.springframework.jdbc: INFO
    org.springframework.scheduling: INFO
    org.springframework.boot.actuate: INFO
    # Set any other packages that might be logging DEBUG
    org.apache: INFO
    com.zaxxer: INFO
    org.postgresql: INFO