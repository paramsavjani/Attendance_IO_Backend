spring:
  application:
    name: attendance-io-backend
  mongodb:
    # Institute knowledge base (clubs, faculty, academic calendar, placements) read by the agent tools.
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/attendance}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 30d
    cookie:
      name: JSESSIONID
      http-only: true # Prevent XSS attacks
      secure: true # Set to true in production with HTTPS
      same-site: none # Required for Capacitor (cross-site WebView -> API)
      max-age: 30d
  # Timezone configuration - Set JVM timezone to IST (Asia/Kolkata) for scheduled tasks
  jackson:
    time-zone: Asia/Kolkata
  ai:
    # Chat assistant provider: google-genai | anthropic | none. The chosen provider's api-key
    # must be set or startup fails; `none` runs without any key and the assistant reports
    # itself disabled.
    model:
      chat: ${AGENT_CHAT_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${AGENT_GEMINI_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AGENT_ANTHROPIC_MODEL:claude-sonnet-5}
          max-tokens: 4096
  mvc:
    async:
      # Streamed assistant answers hold the (async) request open while the model works.
      request-timeout: ${MVC_ASYNC_REQUEST_TIMEOUT:120s}

# Application configuration
app:
  frontend:
    url: ${FRONTEND_URL:https://attendanceio.paramsavjani.in}
  auth-debug: ${AUTH_DEBUG:false}
  bundles:
    dir: ${APP_BUNDLES_DIR:/bundles} # host ~/app-bundles mounted read-only into the container
    public-url: ${APP_BUNDLES_PUBLIC_URL:https://api.attendanceio.paramsavjani.in/api/app/bundles}
  classes:
    start-date: ${CLASSES_START_DATE:2026-07-22} # Autumn 2026-27: first day of lectures
    end-date: ${CLASSES_END_DATE:2026-11-20} # Autumn 2026-27: last date of class/lab/tutorial
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-32-characters-long-for-hs256-algorithm-param-savjani} # Must be at least 256 bits (32 characters) for HS256 algorithm. Store securely in Z-Ability.
    expiration-months: ${JWT_EXPIRATION_MONTHS:2} # Token expiration in months (1 or 2)
  agent:
    # Messages (user + assistant) replayed to the model per turn, taken from the end of the thread.
    history-window: ${AGENT_HISTORY_WINDOW:8}
    # Rows a list tool hands to the model. The true total is always reported alongside.
    max-tool-rows: ${AGENT_MAX_TOOL_ROWS:10}
    # Optional file for the system prompt; re-read when its mtime changes. Blank uses the bundled prompt.
    system-prompt-path: ${AGENT_SYSTEM_PROMPT_PATH:}
    # Messages one user may send per day (IST). 0 = unlimited.
    daily-message-limit: ${AGENT_DAILY_MESSAGE_LIMIT:20}
    # Comma-separated student ids the limit never applies to (maintainer account).
    daily-limit-exempt-student-ids: ${AGENT_DAILY_LIMIT_EXEMPT_STUDENT_IDS:790}
    # Alumni people shown per answer; the next page is a new question.
    alumni-rows-per-answer: ${AGENT_ALUMNI_ROWS_PER_ANSWER:6}
    # Gemini context cache for the fixed half of every call (system prompt + the turn's tool
    # declarations). A cache hit bills that prefix at a tenth of the input price; the student's
    # name, question, history and tool results are never in it and always travel with the request.
    # Keyed by a hash of its contents, so editing the prompt or a tool just makes a new one.
    cache:
      enabled: ${AGENT_CACHE_ENABLED:true}
      # Re-created a couple of minutes before this runs out. Storage is billed per token-hour and a
      # cache is billed for its whole TTL, used or not, so the window is kept short: traffic comes in
      # bursts (one student for five minutes in the evening, then nothing), and a long TTL would be
      # paying for an idle cache nobody comes back to. Measured on real traffic, 15 minutes costs
      # about a quarter less than 30 at the price of one extra creation per burst.
      ttl-minutes: ${AGENT_CACHE_TTL_MINUTES:15}
      # Below this a cache is not worth its storage — the prefix is sent inline instead.
      min-tokens: ${AGENT_CACHE_MIN_TOKENS:1024}
    # Ceiling on one streamed answer including all tool calls.
    request-timeout-seconds: ${AGENT_REQUEST_TIMEOUT_SECONDS:90}
    # Retries with doubling backoff when the model provider throttles (429/402/503) before telling the user it is busy.
    rate-limit-retries: ${AGENT_RATE_LIMIT_RETRIES:3}
    rate-limit-backoff-ms: ${AGENT_RATE_LIMIT_BACKOFF_MS:2000}
  langfuse:
    # Tracing for assistant turns. Blank host/keys -> disabled; the assistant still answers.
    host: ${LANGFUSE_HOST:${LANGFUSE_BASE_URL:}} # either name works
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    environment: ${LANGFUSE_ENVIRONMENT:prod}
  update:
    latest-build: ${APP_LATEST_BUILD:318} # Latest app build number (e.g., 132 from GitHub releases)
    critical-build: ${APP_CRITICAL_BUILD:294} # Minimum supported build number (builds below this require critical update)
    title: ${APP_UPDATE_TITLE:Upgraded AI assistant} # Title for non-critical updates
    message: ${APP_UPDATE_MESSAGE:The AI assistant just got a major upgrade — smarter answers about your attendance, timetable and the DAU alumni network. This version also updates itself in the background, so you get new features without waiting for the Play Store.}
    critical-title: ${APP_CRITICAL_TITLE:AI Assistant is here} # Title for critical updates
    critical-message: ${APP_CRITICAL_MESSAGE:Meet the new AI assistant — ask about attendance, and explore the DAU alumni network with LinkedIn links to connect and get referrals. Please update to continue.} # Message for critical updates

# Server configuration
server:
  port: 8080
  # If you run behind Nginx/Cloudflare/Render/etc, this ensures Spring sees https scheme
  # (prevents Google redirect_uri_mismatch due to http vs https).
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        same-site: none
        secure: true
  error:
    include-message: always
    include-binding-errors: always

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mongo:
      # The knowledge base is optional for the app: a Mongo hiccup must not mark the container unhealthy.
      enabled: false

logging:
  level:
    root: INFO
    # Explicitly set all packages to INFO to prevent DEBUG logs
    com.attendanceio: INFO
    org.springframework: INFO
    org.hibernate: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.springframework.jdbc: INFO
    org.springframework.scheduling: INFO
    org.springframework.boot.actuate: INFO
    # Set any other packages that might be logging DEBUG
    org.apache: INFO
    com.zaxxer: INFO
    org.postgresql: INFO
