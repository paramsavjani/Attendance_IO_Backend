server:
  port: 8081
  servlet:
    session:
      timeout: 30d

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080}
  classes:
    start-date: ${CLASSES_START_DATE:2026-07-22} # Autumn 2026-27: first day of lectures
    end-date: ${CLASSES_END_DATE:2026-11-20} # Autumn 2026-27: last date of class/lab/tutorial
  auth-debug: ${AUTH_DEBUG:false}
  bundles:
    # Over-the-air web bundles for the Android app (see WebBundleService): a folder holding
    # latest.json + web-<version>.zip, and the URL phones download the zips from.
    dir: ${APP_BUNDLES_DIR:./bundles}
    public-url: ${APP_BUNDLES_PUBLIC_URL:http://localhost:8081/api/app/bundles}
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-32-characters-long-for-hs256-algorithm-param-savjani}
    expiration-months: ${JWT_EXPIRATION_MONTHS:2} # Token expiration in months (1 or 2)
  update:
    latest-build: ${APP_LATEST_BUILD:179} # Latest app build number (e.g., 132 from GitHub releases)
    critical-build: ${APP_CRITICAL_BUILD:154} # Minimum supported build number (builds below this require critical update)
    title: ${APP_UPDATE_TITLE:Update Available} # Title for non-critical updates
    message: ${APP_UPDATE_MESSAGE:A new version is available with new features and bug fixes.} # Message for non-critical updates
    critical-title: ${APP_CRITICAL_TITLE:Update Required} # Title for critical updates
    critical-message: ${APP_CRITICAL_MESSAGE:A new version is available with new features and bug fixes.} # Message for critical updates

  security:
    # /api/search/** used to be open to the internet — any student's name, roll number, institute
    # email and per-subject attendance, no login. It is authenticated now. App builds older than the
    # authenticated search call will see 401 on friend search until they update; set this to true to
    # restore the old behaviour while a new build ships, then set it back to false.
    public-student-search: ${PUBLIC_STUDENT_SEARCH:false}
  agent:
    # Messages (user + assistant) replayed to the model per turn, taken from the end of the thread.
    history-window: ${AGENT_HISTORY_WINDOW:8}
    # Every exchange is stored in Postgres (agent_conversation / agent_message, created by
    # ddl-auto like every other table) for analysis; users are never shown past sessions.
    # Rows a list tool hands to the model. The true total is always reported alongside.
    max-tool-rows: ${AGENT_MAX_TOOL_ROWS:10}
    # Optional file for the system prompt; re-read when its mtime changes. Blank uses resources/agent/system-prompt.md.
    system-prompt-path: ${AGENT_SYSTEM_PROMPT_PATH:}
    # Messages one user may send per day (IST). 0 = unlimited.
    daily-message-limit: ${AGENT_DAILY_MESSAGE_LIMIT:20}
    # Comma-separated student ids the limit never applies to (maintainer account).
    daily-limit-exempt-student-ids: ${AGENT_DAILY_LIMIT_EXEMPT_STUDENT_IDS:790}
    # Alumni people shown per answer; the next page is a new question.
    alumni-rows-per-answer: ${AGENT_ALUMNI_ROWS_PER_ANSWER:6}
    # Gemini context cache for the fixed half of every call (system prompt + the turn's tool
    # declarations). A cache hit bills that prefix at a tenth of the input price; the student's
    # name, question, history and tool results are never in it and always travel with the request.
    # Keyed by a hash of its contents, so editing the prompt or a tool just makes a new one.
    cache:
      enabled: ${AGENT_CACHE_ENABLED:true}
      # Storage is billed per token-hour for the whole TTL, used or not, so the window is deliberately
      # short: traffic comes in bursts (one student for five minutes in the evening, then nothing) and
      # a longer TTL is mostly paying for an idle cache nobody comes back to. A day of real traffic
      # had storage at about a third of the assistant's bill at 15 minutes; 5 cuts that threefold and
      # a hot prefix simply gets re-created, which is free.
      ttl-minutes: ${AGENT_CACHE_TTL_MINUTES:5}
      # Times one prefix must be asked for inside a TTL window before it earns a cache. Left at 1
      # (cache on first sight) because replaying a day of real turns says waiting costs money: a cache
      # pays for itself inside a single turn, since every round of the tool loop re-sends the prefix
      # and all of them hit it. Holding out for a second turn measured Rs 0.16/prompt against Rs 0.10.
      # Raise it to 2 to trade that back for latency — a one-off combination then skips the ~8 s the
      # first turn spends creating a cache nobody reuses.
      warmup-uses: ${AGENT_CACHE_WARMUP_USES:1}
      # Below this a cache is not worth its storage — the prefix is sent inline instead.
      min-tokens: ${AGENT_CACHE_MIN_TOKENS:1024}
    # The public demo at ai.paramsavjani.in: the same assistant, anonymous, restricted in code to
    # published institute information (PublicAgentToolPolicy) with phone numbers stripped from every
    # result. Both caps reset at midnight and live in memory.
    public:
      # Answers one visitor gets per day, counted by a salted hash of their address.
      daily-limit-per-visitor: ${AGENT_PUBLIC_DAILY_LIMIT_PER_VISITOR:10}
      # Answers the demo gives per day in total, so the worst case is a known bill (~Rs 40 at 400).
      daily-limit-total: ${AGENT_PUBLIC_DAILY_LIMIT_TOTAL:400}
      # Browser origins allowed to call /api/public/agent (comma-separated).
      origins: ${AGENT_PUBLIC_ORIGINS:https://ai.paramsavjani.in}
    # Ceiling on one streamed answer including all tool calls.
    request-timeout-seconds: ${AGENT_REQUEST_TIMEOUT_SECONDS:90}
    # Retries with doubling backoff when the model provider throttles (429/402/503) before telling the user it is busy.
    rate-limit-retries: ${AGENT_RATE_LIMIT_RETRIES:3}
    rate-limit-backoff-ms: ${AGENT_RATE_LIMIT_BACKOFF_MS:2000}

  langfuse:
    # Tracing for assistant turns. Blank host/keys -> LangfuseClient is a no-op; the app still
    # starts and the assistant still answers.
    host: ${LANGFUSE_HOST:${LANGFUSE_BASE_URL:}} # either name works
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    environment: ${LANGFUSE_ENVIRONMENT:}

firebase:
  service-account:
    path: ${FIREBASE_SERVICE_ACCOUNT_PATH:attendance-io-param-firebase.json} # Path to Firebase service account JSON file (relative to project root)

spring:
  application:
    name: attendance-io-backend
  ai:
    # Chat assistant provider. Both the Google GenAI and Anthropic starters are on the classpath;
    # exactly one is activated by this value, so switching models is config, not code.
    # google-genai | anthropic | none. The chosen provider's api-key must be set or startup
    # fails; `none` runs without any key and the assistant endpoints report themselves disabled.
    model:
      chat: ${AGENT_CHAT_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${AGENT_GEMINI_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AGENT_ANTHROPIC_MODEL:claude-sonnet-5}
          max-tokens: 4096
  mvc:
    async:
      # Streamed assistant answers hold the (async) request open while the model works.
      request-timeout: ${MVC_ASYNC_REQUEST_TIMEOUT:120s}
  mongodb:
    # Institute knowledge base (clubs, faculty, academic calendar, placements) read by the agent tools.
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/attendance}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  session:
    timeout: 30d
    cookie:
      name: JSESSIONID
      http-only: true # Prevent XSS attacks
      secure: false # Set to true in production with HTTPS
      same-site: lax # Local dev: localhost frontend/backend are same-site (ports don't matter)
      max-age: 30d

# Logging (set env vars to DEBUG when diagnosing auth issues)
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}