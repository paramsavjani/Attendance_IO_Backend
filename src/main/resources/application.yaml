server:
  port: 8081
  servlet:
    session:
      timeout: 30d

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080}
  classes:
    start-date: ${CLASSES_START_DATE:2026-07-22} # Autumn 2026-27: first day of lectures
    end-date: ${CLASSES_END_DATE:2026-11-20} # Autumn 2026-27: last date of class/lab/tutorial
  auth-debug: ${AUTH_DEBUG:false}
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-32-characters-long-for-hs256-algorithm-param-savjani}
    expiration-months: ${JWT_EXPIRATION_MONTHS:2} # Token expiration in months (1 or 2)
  update:
    latest-build: ${APP_LATEST_BUILD:179} # Latest app build number (e.g., 132 from GitHub releases)
    critical-build: ${APP_CRITICAL_BUILD:154} # Minimum supported build number (builds below this require critical update)
    title: ${APP_UPDATE_TITLE:Update Available} # Title for non-critical updates
    message: ${APP_UPDATE_MESSAGE:A new version is available with new features and bug fixes.} # Message for non-critical updates
    critical-title: ${APP_CRITICAL_TITLE:Update Required} # Title for critical updates
    critical-message: ${APP_CRITICAL_MESSAGE:A new version is available with new features and bug fixes.} # Message for critical updates

  agent:
    # Messages (user + assistant) replayed to the model per turn, taken from the end of the thread.
    history-window: ${AGENT_HISTORY_WINDOW:30}
    # Every exchange is stored in Postgres (agent_conversation / agent_message, created by
    # ddl-auto like every other table) for analysis; users are never shown past sessions.
    # Rows a list tool hands to the model. The true total is always reported alongside.
    max-tool-rows: ${AGENT_MAX_TOOL_ROWS:20}
    # Optional file for the system prompt; re-read when its mtime changes. Blank uses resources/agent/system-prompt.md.
    system-prompt-path: ${AGENT_SYSTEM_PROMPT_PATH:}
    # Ceiling on one streamed answer including all tool calls.
    request-timeout-seconds: ${AGENT_REQUEST_TIMEOUT_SECONDS:90}

  langfuse:
    # Tracing for assistant turns. Blank host/keys -> LangfuseClient is a no-op; the app still
    # starts and the assistant still answers.
    host: ${LANGFUSE_HOST:}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    environment: ${LANGFUSE_ENVIRONMENT:}

firebase:
  service-account:
    path: ${FIREBASE_SERVICE_ACCOUNT_PATH:attendance-io-param-firebase.json} # Path to Firebase service account JSON file (relative to project root)

spring:
  application:
    name: attendance-io-backend
  ai:
    # Chat assistant provider. Both the Google GenAI and Anthropic starters are on the classpath;
    # exactly one is activated by this value, so switching models is config, not code.
    # google-genai | anthropic | none. The chosen provider's api-key must be set or startup
    # fails; `none` runs without any key and the assistant endpoints report themselves disabled.
    model:
      chat: ${AGENT_CHAT_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${AGENT_GEMINI_MODEL:gemini-2.5-flash-lite}
            temperature: 0.2
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AGENT_ANTHROPIC_MODEL:claude-sonnet-5}
          max-tokens: 4096
  mvc:
    async:
      # Streamed assistant answers hold the (async) request open while the model works.
      request-timeout: ${MVC_ASYNC_REQUEST_TIMEOUT:120s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  session:
    timeout: 30d
    cookie:
      name: JSESSIONID
      http-only: true # Prevent XSS attacks
      secure: false # Set to true in production with HTTPS
      same-site: lax # Local dev: localhost frontend/backend are same-site (ports don't matter)
      max-age: 30d

# Logging (set env vars to DEBUG when diagnosing auth issues)
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}