server:
  port: 8081
  servlet:
    session:
      timeout: 30d

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080}
  classes:
    start-date: ${CLASSES_START_DATE:2026-01-05} # Format: yyyy-MM-dd (e.g., 2025-01-01)
    end-date: ${CLASSES_END_DATE:2026-04-30} # Format: yyyy-MM-dd (e.g., 2026-04-30) - Semester/lecture end date
  auth-debug: ${AUTH_DEBUG:false}
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-32-characters-long-for-hs256-algorithm-param-savjani}
    expiration-months: ${JWT_EXPIRATION_MONTHS:2} # Token expiration in months (1 or 2)
  update:
    latest-build: ${APP_LATEST_BUILD:132} # Latest app build number (e.g., 132 from GitHub releases)
    critical-build: ${APP_CRITICAL_BUILD:132} # Minimum supported build number (builds below this require critical update)
    title: ${APP_UPDATE_TITLE:Update Available} # Title for non-critical updates
    message: ${APP_UPDATE_MESSAGE:A new version of the app is available with updated features including Lab and Tutorial Timetable. Please update to continue.} # Message for non-critical updates
    critical-title: ${APP_CRITICAL_TITLE:Update Required} # Title for critical updates
    critical-message: ${APP_CRITICAL_MESSAGE:This version is no longer supported. Please update the app to continue. The latest version includes new features like Lab and Tutorial Timetable support.} # Message for critical updates

firebase:
  service-account:
    path: ${FIREBASE_SERVICE_ACCOUNT_PATH:attendance-io-param-firebase.json} # Path to Firebase service account JSON file (relative to project root)

spring:
  application:
    name: attendance-io-backend
  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?user=postgres.dlhlwiluylwkatexlhvq&password=parampbr**
    username: postgres.dlhlwiluylwkatexlhvq
    password: parampbr**
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: REDACTED_GOOGLE_CLIENT_ID
            client-secret: REDACTED_GOOGLE_CLIENT_SECRET
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  session:
    timeout: 30d
    cookie:
      name: JSESSIONID
      http-only: true # Prevent XSS attacks
      secure: false # Set to true in production with HTTPS
      same-site: lax # Local dev: localhost frontend/backend are same-site (ports don't matter)
      max-age: 30d

# Logging (set env vars to DEBUG when diagnosing auth issues)
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.attendanceio: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.security.oauth2: ${LOG_LEVEL_OAUTH2:INFO}