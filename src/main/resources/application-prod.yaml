spring:
  application:
    name: attendance-io-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 30d
    cookie:
      name: JSESSIONID
      http-only: true # Prevent XSS attacks
      secure: true # Set to true in production with HTTPS
      same-site: none # Required for Capacitor (cross-site WebView -> API)
      max-age: 30d
  # Timezone configuration - Set JVM timezone to IST (Asia/Kolkata) for scheduled tasks
  jackson:
    time-zone: Asia/Kolkata
  ai:
    # Chat assistant provider: google-genai | anthropic | none. The chosen provider's api-key
    # must be set or startup fails; `none` runs without any key and the assistant reports
    # itself disabled.
    model:
      chat: ${AGENT_CHAT_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${AGENT_GEMINI_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AGENT_ANTHROPIC_MODEL:claude-sonnet-5}
          max-tokens: 4096
  mvc:
    async:
      # Streamed assistant answers hold the (async) request open while the model works.
      request-timeout: ${MVC_ASYNC_REQUEST_TIMEOUT:120s}

# Application configuration
app:
  frontend:
    url: ${FRONTEND_URL:https://attendanceio.paramsavjani.in}
  auth-debug: ${AUTH_DEBUG:false}
  classes:
    start-date: ${CLASSES_START_DATE:2026-07-22} # Autumn 2026-27: first day of lectures
    end-date: ${CLASSES_END_DATE:2026-11-20} # Autumn 2026-27: last date of class/lab/tutorial
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-32-characters-long-for-hs256-algorithm-param-savjani} # Must be at least 256 bits (32 characters) for HS256 algorithm. Store securely in Z-Ability.
    expiration-months: ${JWT_EXPIRATION_MONTHS:2} # Token expiration in months (1 or 2)
  agent:
    # Messages (user + assistant) replayed to the model per turn, taken from the end of the thread.
    history-window: ${AGENT_HISTORY_WINDOW:30}
    # Rows a list tool hands to the model. The true total is always reported alongside.
    max-tool-rows: ${AGENT_MAX_TOOL_ROWS:20}
    # Optional file for the system prompt; re-read when its mtime changes. Blank uses the bundled prompt.
    system-prompt-path: ${AGENT_SYSTEM_PROMPT_PATH:}
    # Ceiling on one streamed answer including all tool calls.
    request-timeout-seconds: ${AGENT_REQUEST_TIMEOUT_SECONDS:90}
  langfuse:
    # Tracing for assistant turns. Blank host/keys -> disabled; the assistant still answers.
    host: ${LANGFUSE_HOST:}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    environment: ${LANGFUSE_ENVIRONMENT:prod}
  update:
    latest-build: ${APP_LATEST_BUILD:286} # Latest app build number (e.g., 132 from GitHub releases)
    critical-build: ${APP_CRITICAL_BUILD:286} # Minimum supported build number (builds below this require critical update)
    title: ${APP_UPDATE_TITLE:Update Available} # Title for non-critical updates
    message: ${APP_UPDATE_MESSAGE:Updated the names and attendance of the freshers.}
    critical-title: ${APP_CRITICAL_TITLE:Update Required} # Title for critical updates
    critical-message: ${APP_CRITICAL_MESSAGE:Updated the names and attendance of the freshers. Please update to continue.} # Message for critical updates

# Server configuration
server:
  port: 8080
  # If you run behind Nginx/Cloudflare/Render/etc, this ensures Spring sees https scheme
  # (prevents Google redirect_uri_mismatch due to http vs https).
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        same-site: none
        secure: true
  error:
    include-message: always
    include-binding-errors: always

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    # Explicitly set all packages to INFO to prevent DEBUG logs
    com.attendanceio: INFO
    org.springframework: INFO
    org.hibernate: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.springframework.jdbc: INFO
    org.springframework.scheduling: INFO
    org.springframework.boot.actuate: INFO
    # Set any other packages that might be logging DEBUG
    org.apache: INFO
    com.zaxxer: INFO
    org.postgresql: INFO
